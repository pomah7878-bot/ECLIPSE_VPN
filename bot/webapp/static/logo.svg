<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="disc" cx="44%" cy="36%" r="70%">
      <stop offset="0" stop-color="#111114"/>
      <stop offset="0.62" stop-color="#070708"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="rim" x1="0.86" y1="0.08" x2="0.16" y2="0.96">
      <stop offset="0" stop-color="#FFE8A7"/>
      <stop offset="0.18" stop-color="#E9B35C"/>
      <stop offset="0.42" stop-color="#9A5C27"/>
      <stop offset="0.68" stop-color="#3A2010"/>
      <stop offset="0.88" stop-color="#0C0704"/>
      <stop offset="1" stop-color="#050302"/>
    </linearGradient>
    <linearGradient id="hot" x1="0.20" y1="0.02" x2="0.82" y2="0.62">
      <stop offset="0" stop-color="#FFF8DE"/>
      <stop offset="0.30" stop-color="#FFE08A"/>
      <stop offset="0.70" stop-color="#FFC14E"/>
      <stop offset="1" stop-color="#D57A22"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- soft warm halo, fully transparent outside the circle -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#F6B84C" stroke-width="20" opacity="0.20" filter="url(#glow)"/>

  <!-- eclipse body -->
  <circle cx="256" cy="256" r="178" fill="url(#disc)"/>

  <!-- metallic rim: bright only at the upper-right -->
  <circle cx="256" cy="256" r="188" fill="none" stroke="url(#rim)" stroke-width="15"/>

  <!-- hot crescent -->
  <path d="M 268 72 A 188 188 0 0 1 441 247" fill="none" stroke="url(#hot)" stroke-width="12" stroke-linecap="round" filter="url(#soft)"/>
  <path d="M 278 70 A 188 188 0 0 1 441 240" fill="none" stroke="#FFF4CB" stroke-width="5" stroke-linecap="round" opacity="0.95"/>
  <path d="M 294 80 A 188 188 0 0 1 424 216" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>

  <!-- faint bronze reflection on the lower-left -->
  <path d="M 92 306 A 188 188 0 0 0 202 427" fill="none" stroke="#B88648" stroke-width="3" stroke-linecap="round" opacity="0.28"/>
</svg>
