<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="disc" cx="46%" cy="40%" r="62%">
      <stop offset="0" stop-color="#0b0b0d"/>
      <stop offset="0.75" stop-color="#050506"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="rim" x1="0.42" y1="0.02" x2="0.62" y2="0.99">
      <stop offset="0" stop-color="#8b5a24"/>
      <stop offset="0.30" stop-color="#d59a45"/>
      <stop offset="0.50" stop-color="#f6c86b"/>
      <stop offset="0.66" stop-color="#d48b36"/>
      <stop offset="0.84" stop-color="#744019"/>
      <stop offset="1" stop-color="#2a170a"/>
    </linearGradient>
    <linearGradient id="hot" x1="0.18" y1="0.02" x2="0.84" y2="0.62">
      <stop offset="0" stop-color="#fffdf2"/>
      <stop offset="0.22" stop-color="#fff2c4"/>
      <stop offset="0.55" stop-color="#ffd477"/>
      <stop offset="0.82" stop-color="#f0a83c"/>
      <stop offset="1" stop-color="#b95f1b"/>
    </linearGradient>
    <filter id="halo" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="rayblur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- warm halo, fully transparent around the mark -->
  <circle cx="256" cy="256" r="152" fill="none" stroke="#e0a24d" stroke-width="22" opacity="0.22" filter="url(#halo)"/>

  <!-- gold corona rays, same visual language as the connect button -->
  <g stroke="#f3c75b" stroke-width="2.2" stroke-linecap="round" opacity="0.58" filter="url(#rayblur)">
    <line x1="256" y1="72" x2="256" y2="96"/>
    <line x1="256" y1="416" x2="256" y2="440"/>
    <line x1="72" y1="256" x2="96" y2="256"/>
    <line x1="416" y1="256" x2="440" y2="256"/>
    <line x1="126" y1="126" x2="144" y2="144"/>
    <line x1="368" y1="368" x2="386" y2="386"/>
    <line x1="386" y1="126" x2="368" y2="144"/>
    <line x1="144" y1="368" x2="126" y2="386"/>
    <line x1="184" y1="90" x2="194" y2="112"/>
    <line x1="318" y1="400" x2="328" y2="422"/>
    <line x1="90" y1="184" x2="112" y2="194"/>
    <line x1="400" y1="318" x2="422" y2="328"/>
    <line x1="328" y1="90" x2="318" y2="112"/>
    <line x1="194" y1="400" x2="184" y2="422"/>
    <line x1="422" y1="184" x2="400" y2="194"/>
    <line x1="112" y1="318" x2="90" y2="328"/>
  </g>

  <!-- eclipse body -->
  <circle cx="256" cy="256" r="128" fill="url(#disc)"/>

  <!-- thick premium rim -->
  <circle cx="256" cy="256" r="136" fill="none" stroke="url(#rim)" stroke-width="17"/>

  <!-- hot solar crescent, upper-right only -->
  <path d="M 256 120 A 136 136 0 0 1 392 256" fill="none" stroke="url(#hot)" stroke-width="13" stroke-linecap="round" filter="url(#soft)"/>
  <path d="M 266 119 A 136 136 0 0 1 392 249" fill="none" stroke="#ffe9a8" stroke-width="6" stroke-linecap="round"/>
  <path d="M 279 124 A 136 136 0 0 1 380 227" fill="none" stroke="#fffdf2" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>

  <!-- faint bronze reflection at the lower-left -->
  <path d="M 137 322 A 136 136 0 0 0 190 388" fill="none" stroke="#d8a05a" stroke-width="3" stroke-linecap="round" opacity="0.22"/>
</svg>
