<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Подписка</title>
<style>
  :root { --bg:#0b0d14; --panel:#141824; --panel2:#1b2030; --line:#262c3d; --ink:#e8ebf3; --mist:#8b93a7;
          --accent:#e6b866; --accent-ink:#1a1205; --ok:#3dd6b0; --warn:#f0a73a; --bad:#ff6b6b; --blue:#6aa8ff; --purple:#b48cff; }
  :root[data-theme="light"] { --bg:#f3f5f9; --panel:#ffffff; --panel2:#f6f7fb; --line:#e3e6ee; --ink:#151a26; --mist:#667085;
          --accent:#c98f2a; --accent-ink:#ffffff; --ok:#12a37f; --warn:#d48806; --bad:#e5484d; --blue:#2f6fde; --purple:#7a4fd6; }

  button { font:inherit; }
  .wrap { max-width:820px; margin:0 auto; padding:20px 16px 40px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:20px; }
  /* шапка */
  .head { display:flex; align-items:center; gap:12px; padding-bottom:16px; border-bottom:1px solid var(--line); }
  .mark { width:44px; height:44px; border-radius:12px; background:var(--accent); color:var(--accent-ink);
          display:flex; align-items:center; justify-content:center; font-weight:800; font-size:20px; flex-shrink:0; }
  .brand { flex:1; min-width:0; }
  .title { font-weight:700; font-size:18px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .muted { color:var(--mist); font-size:13px; }
  .round { width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--panel2); color:var(--ink);
           cursor:pointer; font-size:17px; flex-shrink:0; }
  /* главный блок */
  .hero { display:flex; gap:22px; align-items:center; padding:20px 0; flex-wrap:wrap; }
  .ring { position:relative; width:156px; height:156px; flex-shrink:0; margin:0 auto; }
  .ring svg { transform:rotate(-90deg); }
  .ring .c { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring .v { font-size:26px; font-weight:700; } .ring .l { color:var(--mist); font-size:12px; }
  .sum { flex:1; min-width:260px; }
  .label { color:var(--mist); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .big { font-size:34px; font-weight:800; line-height:1.1; margin:2px 0; } .big small { font-size:16px; font-weight:600; color:var(--mist); margin-left:4px; }

  .tag { display:inline-block; padding:1px 8px; border-radius:6px; font-size:12px; font-weight:700; }
  .t-ok { background:color-mix(in srgb,var(--ok) 16%,transparent); color:var(--ok); }
  .t-bad { background:color-mix(in srgb,var(--bad) 16%,transparent); color:var(--bad); }
  .t-purple { background:color-mix(in srgb,var(--purple) 16%,transparent); color:var(--purple); }
  .t-blue { background:color-mix(in srgb,var(--blue) 14%,transparent); color:var(--blue); }
  .t-gold { background:color-mix(in srgb,var(--accent) 18%,transparent); color:var(--accent); }
  .alert { margin-top:4px; padding:10px 12px; border-radius:12px; border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);
           background:color-mix(in srgb,var(--bad) 8%,transparent); display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .alert span { flex:1; min-width:180px; }
  /* вкладки */
  .tabs { display:flex; gap:22px; border-bottom:1px solid var(--line); overflow-x:auto; }
  .tab { background:none; border:none; color:var(--mist); padding:10px 0; cursor:pointer; font-weight:600; border-bottom:2px solid transparent;
         white-space:nowrap; display:flex; gap:6px; align-items:center; }
  .tab.on { color:var(--ink); border-bottom-color:var(--accent); }
  .cnt { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:0 7px; font-size:12px; }
  .pane { padding-top:6px; } .hidden { display:none !important; }
  .row { display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:none; }
  .rmain { flex:1; min-width:0; }
  .rtitle { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block; color:var(--ink); text-decoration:none; }
  .rurl { font:12px ui-monospace,Menlo,monospace; color:var(--mist); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .acts { display:flex; gap:6px; flex-shrink:0; }
  .ib { width:36px; height:36px; border-radius:10px; border:1px solid var(--line); background:var(--panel2); color:var(--ink); cursor:pointer; font-size:15px; }
  .btn { padding:9px 14px; border-radius:10px; border:1px solid var(--line); background:var(--panel2); color:var(--ink);
         font-weight:600; font-size:14px; cursor:pointer; text-decoration:none; display:inline-block; text-align:center; }
  .btn.pri { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .btn.sm { padding:6px 12px; font-size:13px; }
  .qrcard { display:flex; gap:16px; align-items:center; margin-top:14px; padding:14px; border-radius:14px; background:var(--panel2); border:1px solid var(--line); }
  .qrcard img { width:112px; height:112px; background:#fff; border-radius:10px; padding:6px; flex-shrink:0; }
  .seg { display:inline-flex; background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:3px; margin:12px 0 4px; }
  .seg button { border:none; background:none; color:var(--mist); padding:7px 16px; border-radius:9px; cursor:pointer; font-weight:600; }
  .seg button.on { background:var(--panel); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.2); }

  .amark { width:32px; height:32px; border-radius:9px; background:var(--panel2); border:1px solid var(--line); display:flex;

  .amark img { width:100%; height:100%; border-radius:8px; object-fit:cover; }
  .amark.tint { background:var(--panel2); }
  .amark .glyph { width:22px; height:22px; background:var(--accent); -webkit-mask:var(--m) center/contain no-repeat; mask:var(--m) center/contain no-repeat; }
  .amark.full { border:none; background:none; }
  .bar { padding:12px 0 4px; }
  .cfgbar { display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; padding-bottom:12px; }
  .filters { display:flex; gap:6px; flex-wrap:wrap; }
  .fchip { --c:var(--accent); border:1px solid var(--line); background:var(--panel2); color:var(--mist); border-radius:999px;
           padding:5px 8px 5px 12px; cursor:pointer; font-weight:600; font-size:13px; display:inline-flex; gap:6px; align-items:center; }
  .fchip.on { color:var(--c); border-color:var(--c); background:color-mix(in srgb,var(--c) 12%,transparent); }
  .cfgs { display:flex; flex-direction:column; gap:8px; }
  .cfg { --pc:var(--blue); position:relative; display:flex; align-items:center; gap:12px; padding:12px 12px 12px 18px; border-radius:14px;
         border:1px solid var(--line); overflow:hidden; transition:border-color .15s, transform .15s;
         background:linear-gradient(90deg, color-mix(in srgb,var(--pc) 10%,var(--panel2)) 0%, var(--panel2) 45%); }
  .cfg::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--pc); box-shadow:0 0 12px var(--pc); }
  .cfg:hover { border-color:color-mix(in srgb,var(--pc) 55%,var(--line)); transform:translateY(-1px); }
  .cfg-body { flex:1; min-width:0; }
  .chips { display:flex; gap:5px; align-items:center; flex-wrap:wrap; margin-bottom:5px; }
  .chip { --c:var(--blue); font:700 11px/1 ui-monospace,Menlo,monospace; letter-spacing:.04em; padding:4px 7px; border-radius:6px;
          color:var(--c); border:1px solid color-mix(in srgb,var(--c) 45%,transparent); background:color-mix(in srgb,var(--c) 10%,transparent); }
  .chip.solid { background:var(--c); color:#fff; border-color:var(--c); text-shadow:0 1px 1px rgba(0,0,0,.25); }
  :root[data-theme="light"] .chip:not(.solid), :root[data-theme="light"] .fchip.on { color:color-mix(in srgb,var(--c) 55%,#000); border-color:color-mix(in srgb,var(--c) 60%,transparent); }
  .chip.solid.ink { color:#2a2000; text-shadow:none; }
  .port { font:600 12px ui-monospace,Menlo,monospace; color:var(--mist); margin-left:2px; }
  .cfg-title { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .foot { display:flex; gap:18px; flex-wrap:wrap; justify-content:center; padding-top:16px; margin-top:8px; border-top:1px solid var(--line); }
  .foot a { color:var(--accent); text-decoration:none; }
  /* окно QR */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:16px; z-index:10; }
  .mbox { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:18px; width:100%; max-width:320px; text-align:center; }
  .mbox img { width:240px; height:240px; max-width:100%; background:#fff; border-radius:12px; padding:8px; }
  .mbox .t { font-weight:700; margin-bottom:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mbox .acts { justify-content:center; margin-top:12px; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--panel2); border:1px solid var(--line); color:var(--ink);
           padding:10px 16px; border-radius:12px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:20; }
  .toast.on { opacity:1; }
  @media (max-width:520px) { .card { padding:16px; } .big { font-size:28px; } .qrcard img { width:96px; height:96px; } }
</style>
</head>
<body>
<div class="wrap"><div class="card" id="app"></div></div>
<div class="toast" id="toast"></div>

      row.append(appIcon(n), $('span', 'rmain rtitle', n), add); grid.append(row); }); };
  [['android', 'Android'], ['ios', 'iOS']].forEach(([p, l]) => { const b = $('button', '', l); b.dataset.p = p; b.onclick = () => { plat = p; drawApps(); }; seg.append(b); });
  pA.append(seg, grid, $('div', 'muted', 'Если приложение не открылось — установите его и нажмите «Добавить» ещё раз, или скопируйте ссылку подписки на вкладке «Ссылки».'));
  drawApps();
  addTab('Приложения', null, pA);

  // 3. Подключения: метки «протокол · транспорт · защита» как в 3x-ui, цвет карточки по протоколу, фильтр
  if (D.configs.length) {
    const PROTO = { vless: ['VLESS', '#5b7cfa'], vmess: ['VMess', '#3b9cff'], trojan: ['Trojan', '#ff7a45'], ss: ['Shadowsocks', '#a66bff'],
      shadowsocks: ['Shadowsocks', '#a66bff'], hysteria2: ['Hysteria2', '#f759ab'], hy2: ['Hysteria2', '#f759ab'], hysteria: ['Hysteria', '#f759ab'],
      tuic: ['TUIC', '#fa8c16'], wireguard: ['WireGuard', '#13c2c2'], wg: ['WireGuard', '#13c2c2'], vpn: ['AmneziaWG', '#e8c02b'], tg: ['MTProto', '#3b9cff'] };
    const SEC = { TLS: '#3dd6b0', XTLS: '#3dd6b0', REALITY: '#b48cff', FAKETLS: '#3dd6b0' };
    const meta = c => PROTO[c.proto] || [c.proto.charAt(0).toUpperCase() + c.proto.slice(1), '#6aa8ff'];
    const chip = (text, color, solid) => { const e = $('span', 'chip' + (solid ? ' solid' : '') + (solid && color === '#e8c02b' ? ' ink' : ''), text); e.style.setProperty('--c', color); return e; };
    const pC = $('div'); const bar = $('div', 'bar cfgbar');
    const filters = $('div', 'filters'); let cur = '';
    const counts = {}; D.configs.forEach(c => { const n = meta(c)[0]; counts[n] = (counts[n] || 0) + 1; });
    const list = $('div', 'cfgs');
    const visible = () => D.configs.filter(c => !cur || meta(c)[0] === cur);
    const all = $('button', 'btn', '⧉ Копировать все');
    all.onclick = () => copy(visible().map(c => c.link).join('\n'), cur ? 'Подключения ' + cur + ' скопированы' : 'Все подключения скопированы');
    const draw = () => {
      filters.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.f === cur));
      list.replaceChildren();
      visible().forEach(c => {
        const i = D.configs.indexOf(c), [pn, pc] = meta(c), title = c.name || ('Подключение ' + (i + 1));
        const card = $('div', 'cfg'); card.style.setProperty('--pc', pc);
        const body = $('div', 'cfg-body'), tags = $('div', 'chips');
        tags.append(chip(pn, pc, true));
        if (c.net) tags.append(chip(c.net, '#e6b866'));
        if (c.sec) tags.append(chip(c.sec, SEC[c.sec] || '#8b93a7'));
        if (c.port) tags.append($('span', 'port', ':' + c.port));
        const tt = $('div', 'cfg-title', title); tt.title = title;
        body.append(tags, tt);
        const acts = $('div', 'acts'); acts.append(iconBtn('⧉', 'Копировать', () => copy(c.link)), iconBtn('▦', 'QR-код', () => qrModal(c.link, title)));
        card.append(body, acts); list.append(card);
      });
    };
    if (Object.keys(counts).length > 1) {
      [['', 'Все', D.configs.length]].concat(Object.entries(counts).map(([n, k]) => [n, n, k])).forEach(([f, label, k]) => {
        const b = $('button', 'fchip', label); b.dataset.f = f; b.append($('span', 'cnt', String(k)));
        if (f) b.style.setProperty('--c', (Object.values(PROTO).find(x => x[0] === f) || [0, '#6aa8ff'])[1]);
        b.onclick = () => { cur = f; draw(); }; filters.append(b);
      });
    }
    bar.append(filters, all); pC.append(bar, list); draw();
    addTab('Подключения', D.configs.length, pC);
  }

  // подвал
  const foot = $('div', 'foot');
  if (D.update_hours > 0) foot.append($('span', 'muted', '🕒 Обновляется каждые ' + D.update_hours + ' ч'));
  if (D.support_url) { const s = $('a', '', '💬 Поддержка'); s.href = D.support_url; s.target = '_blank'; s.rel = 'noopener'; foot.append(s); }
  if (renew && healthy) { const s = $('a', '', '🔄 Продлить'); s.href = renew; s.target = '_blank'; s.rel = 'noopener'; foot.append(s); }
  if (foot.childNodes.length) app.append(foot);
}
render();
</script>
</body>
</html>
