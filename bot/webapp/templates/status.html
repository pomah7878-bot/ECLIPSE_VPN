<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Статус серверов</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<style>
    :root {
        --void: #0A0A10; --panel: #14151D; --hairline: rgba(255,255,255,0.07);
        --ink: #F4F1E9; --mist: #8B90A0; --up: #2FD1C4; --down: #F2626B; --unk: #565A68; --warn: #F2C879;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--void); color: var(--ink); min-height: 100vh;
           font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: var(--mist); font-size: 13px; margin-bottom: 20px; }
    .overall { border-radius: 16px; padding: 16px; margin-bottom: 16px; font-weight: 600; border: 1px solid var(--hairline); background: var(--panel); }
    .overall.ok { border-color: rgba(47,209,196,.4); }
    .overall.partial { border-color: rgba(242,200,121,.5); }
    .overall.outage { border-color: rgba(242,98,107,.5); }
    .row { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--hairline);
           border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; font-size: 14px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .dot.up { background: var(--up); box-shadow: 0 0 8px var(--up); }
    .dot.down { background: var(--down); }
    .dot.unknown { background: var(--unk); }
    .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .val { color: var(--mist); font-variant-numeric: tabular-nums; }
    .foot { color: var(--mist); font-size: 12px; margin-top: 16px; text-align: center; }
</style>
</head>
<body>
<main>
    <h1 id="brandHeader">Статус серверов</h1>
    <div class="sub">Состояние серверов в реальном времени</div>
    <div id="overall" class="overall">Загрузка…</div>
    <div id="list"></div>
    <div class="foot" id="foot">Проверка раз в 15 минут. Страница обновляется сама.</div>
</main>
<script>
    const OVERALL = {
        ok: 'Все серверы работают',
        partial: 'Часть серверов не отвечает',
        outage: 'Серверы не отвечают, уже разбираемся',
        unknown: 'Нет свежих данных'
    };
    function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
    async function load() {
        try {
            const r = await fetch('/api/public/status', { cache: 'no-store' });
            if (!r.ok) throw new Error(r.status);
            const d = await r.json();
            const o = document.getElementById('overall');
            o.className = 'overall ' + d.overall;
            o.textContent = OVERALL[d.overall] || OVERALL.unknown;
            document.getElementById('list').innerHTML = d.servers.map(s => `
                <div class="row"><span class="dot ${s.state}"></span><span class="name">${esc(s.name)}</span>
                <span class="val">${s.state === 'up' ? s.latency_ms + ' мс' : (s.state === 'down' ? 'не отвечает' : 'нет данных')}</span></div>`).join('');
            if (d.checked_at) {
                const t = new Date(d.checked_at);
                document.getElementById('foot').textContent = 'Последняя проверка: ' + t.toLocaleString() + '. Проверка раз в 15 минут.';
            }
        } catch (e) {
            document.getElementById('overall').textContent = 'Не удалось загрузить статус';
        }
    }
    load();
    setInterval(load, 60000);
</script>
</body>
</html>
